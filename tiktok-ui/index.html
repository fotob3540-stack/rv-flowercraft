<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RV FLOWERCRAFT - TikTok Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>RV FLOWERCRAFT</h1>
    <p class="subtitle">TikTok Video Tool</p>

    <section class="card">

      <label for="tiktokUrl">Link TikTok</label>

      <div class="input-row">
        <input
          id="tiktokUrl"
          type="url"
          placeholder="Tempel link TikTok di sini..."
          autocomplete="off"
        >
        <button id="checkBtn">Cek</button>
      </div>

      <p id="status" class="status"></p>

    </section>

    <section id="result" class="card result hidden">

      <div class="preview">
        <img id="cover" alt="Thumbnail TikTok">
      </div>

      <div class="info">

        <h2 id="author">-</h2>

        <p id="description">-</p>

        <div class="details">
          <div>
            <span>Durasi</span>
            <strong id="duration">-</strong>
          </div>

          <div>
            <span>Ukuran</span>
            <strong id="resolution">-</strong>
          </div>

          <div>
            <span>ID</span>
            <strong id="videoId">-</strong>
          </div>
        </div>

        <a
          id="watchBtn"
          class="button"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Buka TikTok
        </a>

        <button
          id="downloadBtn"
          class="button secondary"
          type="button"
          disabled
        >
          Download
        </button>

        <p class="download-note">
          Download MP4 belum diaktifkan karena CDN TikTok menolak request langsung.
        </p>

      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
